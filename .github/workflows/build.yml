name: Build OpenLumn (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openlumn/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Make app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1024, 1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(255, 16, 16, 22))
          $p1 = New-Object System.Drawing.Point 0, 0
          $p2 = New-Object System.Drawing.Point 1024, 1024
          $c1 = [System.Drawing.Color]::FromArgb(255, 255, 61, 129)
          $c2 = [System.Drawing.Color]::FromArgb(255, 61, 123, 255)
          $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush $p1, $p2, $c1, $c2
          $pen = New-Object System.Drawing.Pen $brush, 120
          $g.DrawRectangle($pen, 60, 60, 904, 904)
          $out = Join-Path $env:GITHUB_WORKSPACE "openlumn/app-icon.png"
          $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)

      - name: Generate icons
        working-directory: openlumn/src-tauri
        run: cargo tauri icon ../app-icon.png

      - name: Build installer
        working-directory: openlumn/src-tauri
        run: cargo tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenLumn-windows
          path: |
            openlumn/src-tauri/target/release/bundle/nsis/*.exe
            openlumn/src-tauri/target/release/openlumn.exe
