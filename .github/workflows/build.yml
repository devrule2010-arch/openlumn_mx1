name: Build OpenLumn (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openlumn/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Make app icon
        shell: python
        run: |
          import zlib, struct
          S = 1024
          rows = []
          for y in range(S):
              r = bytearray([0])
              for x in range(S):
                  d = max(abs(x - S / 2), abs(y - S / 2))
                  t = (x + y) / (2 * S)
                  if d > S * 0.46:
                      px = (0, 0, 0, 0)
                  elif d > S * 0.34:
                      px = (int(255 * (1 - t) + 61 * t), int(61 * (1 - t) + 123 * t), int(129 * (1 - t) + 255 * t), 255)
                  else:
                      px = (16, 16, 22, 255)
                  r += bytes(px)
              rows.append(bytes(r))
          def ch(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', S, S, 8, 6, 0,
